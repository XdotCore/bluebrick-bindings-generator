[package]
name = "bluebrick-bindings-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo_metadata = "0.23.1"
itertools = "0.15.0"
pest = "2.8.7"
pest_derive = { version = "2.8.7", features = ["grammar-extras"] }
prettyplease = "0.2.37"
serde = "1.0.228"
serde_json = "1.0.149"
structopt = "0.3.26"
walkdir = "2.5.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bbb-gen"
path = "src/bin.rs"
